name: Deploy Backend API to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'erapor-api/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy API to cPanel via FTP
        run: |
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" ftp://${{ secrets.FTP_SERVER }} <<EOF
          set ftp:ssl-allow no
          set net:timeout 60
          set net:max-retries 3
          mirror --reverse --delete --verbose \
            --exclude-glob .git* \
            --exclude-glob node_modules/ \
            --exclude-glob vendor/ \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob storage/framework/cache/ \
            --exclude-glob storage/logs/ \
            --exclude-glob public/uploads/ \
            ./erapor-api/ /public_html/erapor/erapor-api/
          bye
          EOF
