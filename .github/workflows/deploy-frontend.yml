name: Deploy Frontend to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'erapor-fe/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./erapor-fe
        run: npm install

      - name: Generate Static Site
        working-directory: ./erapor-fe
        env:
          VITE_API_BASE_URL: https://api.erapor.yatindosystem.net
        run: npx nuxi generate

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy to cPanel via FTP
        run: |
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" ftp://${{ secrets.FTP_SERVER }} <<EOF
          set ftp:ssl-allow no
          set net:timeout 60
          set net:max-retries 3
          mirror --reverse --delete --verbose \
            ./erapor-fe/.output/public/ ${{ secrets.FTP_SERVER_DIR }}
          bye
          EOF
